    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f1ea;
        }

        /* Left navigation bar */
        .sidebar {
             width: 300px;
            height: 100vh;
            background-color: #4b2e83;
             color: white;
            position: fixed;
            left: 0;
            top: 0;
        }
        /* Website name */
        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            padding: 30px 0;
            border-bottom: 1px solid #65479a;
        }

        /* Navigation links */
        .nav-links {
            padding: 20px;
        }

        .nav-links a {
            display: block;
            color: white;
            text-decoration: none;
            font-size: 20px;
            padding: 18px;
            margin-bottom: 8px;
            border-radius: 12px;
        }

        /* Changes color when you hover */
        .nav-links a:hover {
            background-color: #d98cb3;
        }

        /* Main page */
        .main-content {
            margin-left: 300px;
            padding: 60px;
        }

        h1 {
            font-size: 44px;
            color: #2f1b4f;
        }

        p {
            font-size: 22px;
            color: #333333;
        }
       
    </style>
</head>

<body>

    <!-- Navigation -->
    <div class="sidebar">

        <div class="logo">
            My Website
        </div>

        <div class="nav-links">
            <a href="#home"> Home</a>
            <a href="#analytics"> Analytics</a>
            <a href="#projects"> Projects</a>
            <a href="#team"> Team</a>
            <a href="#messages"> Messages</a>
            <a href="#settings"> Settings</a>
            <a href="#documents"> Documents</a>
            <a href="#logout"> Logout</a>
        </div>

    </div>

    <!-- Main Content -->
    <div class="main-content">

        <h1>Welcome to My Website</h1>

        <p>
            Click on the links in the navigation menu on the left.
        </p>

    </div>
   
</body>
</html>
